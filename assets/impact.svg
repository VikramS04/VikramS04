<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Impact: 600+ users, 100% workflows digitized, under 2 hours processing time, 300+ DSA questions solved" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .c1 { animation: rise .6s ease-out .1s both; }
    .c2 { animation: rise .6s ease-out .25s both; }
    .c3 { animation: rise .6s ease-out .4s both; }
    .c4 { animation: rise .6s ease-out .55s both; }
  </style>

  <rect x="0.75" y="0.75" width="1198.5" height="168.5" rx="18" fill="#0a0a0b" stroke="#27272a" stroke-width="1.5"/>
  <line x1="300" y1="30" x2="300" y2="140" stroke="#27272a"/>
  <line x1="600" y1="30" x2="600" y2="140" stroke="#27272a"/>
  <line x1="900" y1="30" x2="900" y2="140" stroke="#27272a"/>

  <g class="sans c1" text-anchor="middle">
    <text x="150" y="84" font-size="52" font-weight="800" fill="#a3e635">600+</text>
    <text x="150" y="114" font-size="17" font-weight="600" fill="#e4e4e7">users, one data source</text>
    <text x="150" y="138" font-size="13" fill="#71717a">centralized data access</text>
  </g>
  <g class="sans c2" text-anchor="middle">
    <text x="450" y="84" font-size="52" font-weight="800" fill="#a3e635">100%</text>
    <text x="450" y="114" font-size="17" font-weight="600" fill="#e4e4e7">workflows digitized</text>
    <text x="450" y="138" font-size="13" fill="#71717a">through a custom admin panel</text>
  </g>
  <g class="sans c3" text-anchor="middle">
    <text x="750" y="84" font-size="52" font-weight="800" fill="#a3e635">&lt; 2 hrs</text>
    <text x="750" y="114" font-size="17" font-weight="600" fill="#e4e4e7">processing time</text>
    <text x="750" y="138" font-size="13" fill="#71717a">down from 2–3 days</text>
  </g>
  <g class="sans c4" text-anchor="middle">
    <text x="1050" y="84" font-size="52" font-weight="800" fill="#a3e635">300+</text>
    <text x="1050" y="114" font-size="17" font-weight="600" fill="#e4e4e7">DSA questions solved</text>
    <text x="1050" y="138" font-size="13" fill="#71717a">plus a strong OOPs foundation</text>
  </g>
</svg>
