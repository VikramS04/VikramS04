<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Vikram Saini, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#27272a"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="0%" r="75%">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ping { 0% { r: 5; opacity: 0.9; } 100% { r: 15; opacity: 0; } }
    .a1 { animation: up .7s ease-out .10s both; }
    .a2 { animation: up .7s ease-out .30s both; }
    .a3 { animation: up .7s ease-out .50s both; }
    .a4 { animation: up .7s ease-out .70s both; }
    .a5 { animation: fade 1.2s ease-out .9s both; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .ring { animation: ping 1.8s ease-out infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0a0a0b"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="18" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- faint code block, right side -->
  <g class="mono a5" font-size="17" fill="#52525b">
    <text x="780" y="80">const <tspan fill="#a3e635" fill-opacity="0.85">vikram</tspan> = {</text>
    <text x="804" y="108"><tspan fill="#a1a1aa">role:</tspan> "Full-Stack Developer",</text>
    <text x="804" y="136"><tspan fill="#a1a1aa">stack:</tspan> ["React", "Node", "Mongo"],</text>
    <text x="804" y="164"><tspan fill="#a1a1aa">learning:</tspan> "AI / ML",</text>
    <text x="804" y="192"><tspan fill="#a1a1aa">openTo:</tspan> "SDE roles",</text>
    <text x="780" y="220">};</text>
  </g>

  <!-- main text -->
  <text class="mono a1" x="70" y="88" font-size="18" fill="#71717a">// hello, world. I'm</text>
  <text class="sans a2" x="68" y="168" font-size="78" font-weight="800" fill="url(#name)" letter-spacing="-2">Vikram Saini</text>
  <text class="sans a3" x="70" y="220" font-size="28" font-weight="500" fill="#d4d4d8">Full-Stack Developer</text>
  <rect class="cursor" x="378" y="199" width="3" height="28" fill="#a3e635"/>
  <text class="mono a4" x="70" y="262" font-size="18" fill="#a3e635">React.js · Node.js · Express.js · MongoDB · REST APIs</text>

  <!-- status chip -->
  <g class="a5">
    <rect x="800" y="244" width="340" height="44" rx="22" fill="#a3e635" fill-opacity="0.08" stroke="#a3e635" stroke-opacity="0.45"/>
    <circle class="ring" cx="826" cy="266" r="5" fill="#a3e635"/>
    <circle cx="826" cy="266" r="5" fill="#a3e635"/>
    <text class="sans" x="846" y="272" font-size="16" font-weight="600" fill="#d9f99d">Open to SDE roles &amp; internships</text>
  </g>
</svg>
