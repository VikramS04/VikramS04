<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Vikram Saini, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#172036"/>
    </pattern>
    <radialGradient id="glowA" cx="90%" cy="0%" r="70%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ping { 0% { r: 5; opacity: 0.9; } 100% { r: 15; opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .a1 { animation: up .7s ease-out .10s both; }
    .a2 { animation: up .7s ease-out .30s both; }
    .a3 { animation: up .7s ease-out .50s both; }
    .a4 { animation: up .7s ease-out .70s both; }
    .a5 { animation: fade 1.2s ease-out .9s both; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .ring { animation: ping 1.8s ease-out infinite; }
    .float { animation: float 5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#060b18"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- terminal window chrome -->
  <g class="a1">
    <circle cx="48" cy="38" r="6" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="68" cy="38" r="6" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="88" cy="38" r="6" fill="#4ade80" fill-opacity="0.85"/>
    <text class="mono" x="112" y="43" font-size="14" fill="#94a3b8">~/vikram-saini — zsh</text>
  </g>

  <!-- faint code block, right side -->
  <g class="mono a5 float" font-size="17" fill="#94a3b8">
    <text x="780" y="104">const <tspan fill="#38bdf8" fill-opacity="0.9">vikram</tspan> = {</text>
    <text x="804" y="132"><tspan fill="#e2e8f0">role:</tspan> "Full-Stack Developer",</text>
    <text x="804" y="160"><tspan fill="#e2e8f0">stack:</tspan> ["React", "Node", "Mongo"],</text>
    <text x="804" y="188"><tspan fill="#e2e8f0">degree:</tspan> "B.Tech CSE (AI/ML)",</text>
    <text x="804" y="216"><tspan fill="#e2e8f0">openTo:</tspan> "SDE roles",</text>
    <text x="780" y="244">};</text>
  </g>

  <!-- main text -->
  <text class="mono a1" x="70" y="112" font-size="18" fill="#94a3b8">// hello, world. I'm</text>
  <text class="sans a2" x="68" y="192" font-size="78" font-weight="800" fill="url(#name)" letter-spacing="-2">Vikram Saini</text>
  <text class="sans a3" x="70" y="244" font-size="28" font-weight="500" fill="#cbd5e1">Full-Stack Developer</text>
  <rect class="cursor" x="338" y="223" width="3" height="28" fill="#38bdf8"/>
  <text class="mono a4" x="70" y="286" font-size="18" fill="#38bdf8">React.js · Node.js · Express.js · MongoDB · REST APIs</text>

  <!-- status chip -->
  <g class="a5">
    <rect x="800" y="268" width="340" height="44" rx="22" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle class="ring" cx="826" cy="290" r="5" fill="#38bdf8"/>
    <circle cx="826" cy="290" r="5" fill="#38bdf8"/>
    <text class="sans" x="846" y="296" font-size="16" font-weight="600" fill="#bae6fd">Open to SDE roles &amp; internships</text>
  </g>
</svg>
